<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JAPAN — THE CITY COLLECTION</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="styles-scroll.css">
<script>
  // ---- 読み込み：既定は単一バンドル dist/scroll.bundle.js（Three.js r187 同梱・CDN 不要）。
  //   ?bundle=0 でモジュール版（import map）を強制。バンドルが読み込めない場合も自動でモジュール版へ切り替える。
  //   モジュール版の Three.js は jsDelivr CDN（0.187.0 固定）。?three=local か CDN 不通ならローカル vendor/three に切替。
  window.THREE_VERSION = '0.187.0';
  window.__threeSource = 'bundle';
  window.__loadMode = null;
  window.__bootError = null;
  (async function () {
    const q = new URLSearchParams(location.search);
    const fail = (e) => { window.__bootError = String(e && e.stack || e); const el = document.getElementById('loadMsg'); if (el) el.textContent = '起動に失敗: ' + e; console.error(e); };
    if (q.get('bundle') !== '0') {
      try { await import('./dist/scroll.bundle.js'); window.__loadMode = 'bundle'; return; }
      catch (e) { console.warn('[scroll] バンドルを読み込めないためモジュール版に切り替えます:', e); window.__bundleError = String(e); }
    }
    window.__loadMode = 'modules';
    const V = window.THREE_VERSION;
    const cdn = `https://cdn.jsdelivr.net/npm/three@${V}/`;
    const local = new URL('./vendor/three/', document.baseURI).href;
    const want = q.get('three') || 'cdn';
    let base = want === 'local' ? local : cdn;
    window.__threeSource = want === 'local' ? 'local' : 'cdn';
    if (want !== 'local') {
      try {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 6000);
        const r = await fetch(cdn + 'build/three.module.js', { method: 'HEAD', mode: 'cors', signal: ctl.signal });
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch (e) {
        base = local; window.__threeSource = 'local (CDN不通のため自動切替)';
      }
    }
    const map = { imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } };
    const s = document.createElement('script');
    s.type = 'importmap'; s.textContent = JSON.stringify(map);
    document.head.appendChild(s);
    try { await import('./src/scroll/app.js'); } catch (e) { fail(e); }
  })();
</script>
</head>
<body>
<main id="track">
  <div id="stage">
    <canvas id="cv" width="320" height="568"></canvas>
    <div class="captions" aria-live="off"></div>   <!-- キャプションは都市モジュールの定義から生成 -->
    <div class="loading" id="loading"><div class="spin"></div><p id="loadMsg">読み込み中…</p></div>
  </div>
</main>
</body>
</html>
