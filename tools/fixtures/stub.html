<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>export pipeline stub</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
// Three.js なしでエクスポート経路（フレーム固定→PNG→ffmpeg）を検証するためのスタブ。
import { Timeline, titleState, fadeBlack } from '/src/timeline.js';
import { CameraRig } from '/src/camera.js';

const q = new URLSearchParams(location.search);
const scale = parseFloat(q.get('scale') || '1');
const W = Math.round(1920 * scale), H = Math.round(1080 * scale);
const tl = new Timeline({ fps: 30, duration: 15 });
const cv = document.getElementById('stage');
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d');
const rig = new CameraRig([
  { t: 0, pos: [0, 100, 0], target: [0, 0, 0], fov: 40 },
  { t: 15, pos: [100, 20, 0], target: [0, 0, 0], fov: 40 },
]);

window.__meta = { frameCount: tl.frameCount, fps: tl.fps, width: W, height: H };
window.__renderFrame = async (i) => {
  const t = tl.timeAtFrame(i);
  const c = rig.sample(t);
  // フレーム番号が目で確認できるよう、番号とカメラ高さを描く
  ctx.fillStyle = `hsl(${(i / tl.frameCount) * 300}, 40%, 18%)`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(H * 0.08)}px sans-serif`;
  ctx.fillText(`frame ${i}  t=${t.toFixed(3)}s  camY=${c.position[1].toFixed(1)}`, W * 0.05, H * 0.5);
  const ts = titleState(t, tl.duration);
  ctx.globalAlpha = ts.opacity;
  ctx.fillText('STUB', W * 0.05, H * 0.8);
  ctx.globalAlpha = 1 - fadeBlack(t, tl.duration);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
};
window.__ready = true;
</script>
</body>
</html>
