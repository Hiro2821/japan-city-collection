<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>JAPAN — THE CITY COLLECTION</title>
<link rel="stylesheet" href="styles.css">
<script>
  // ---- Three.js の読み込み元（import map）。バージョンは1か所で固定する。
  //   既定: jsDelivr CDN。  ?three=local でローカル(vendor/three)。CDN に届かない場合は自動でローカルへ切替。
  window.THREE_VERSION = '0.187.0';
  window.__threeSource = 'cdn';
  window.__bootError = null;
  (async function () {
    const V = window.THREE_VERSION;
    const cdn = `https://cdn.jsdelivr.net/npm/three@${V}/`;
    const local = new URL('./vendor/three/', document.baseURI).href;
    const want = new URLSearchParams(location.search).get('three') || 'cdn';
    let base = want === 'local' ? local : cdn;
    window.__threeSource = want === 'local' ? 'local' : 'cdn';
    if (want !== 'local') {
      try {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 6000);
        const r = await fetch(cdn + 'build/three.module.js', { method: 'HEAD', mode: 'cors', signal: ctl.signal });
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch (e) {
        base = local; window.__threeSource = 'local (CDN不通のため自動切替)';
      }
    }
    const map = { imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } };
    const s = document.createElement('script');
    s.type = 'importmap'; s.textContent = JSON.stringify(map);
    document.head.appendChild(s);
    try { await import('./src/main.js'); }
    catch (e) { window.__bootError = String(e && e.stack || e); document.getElementById('status').textContent = '起動に失敗: ' + e; console.error(e); }
  })();
</script>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <h1>JAPAN <span>—</span> THE CITY COLLECTION</h1>
      <p>10 Cities. 10 Stories. One Japan.</p>
    </div>
    <select id="citySel" aria-label="都市を選ぶ"></select>
  </header>

  <section class="stagewrap" id="stageWrap">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="loading" id="loading"><div class="spin"></div><p id="loadMsg">読み込み中…</p></div>
  </section>

  <section class="controls" aria-label="再生コントロール">
    <button id="playBtn" class="btn primary" aria-label="再生/一時停止">⏸</button>
    <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="シーク">
    <span id="timeLbl" class="mono">0.0 / 15.0s</span>
    <select id="resSel" aria-label="プレビュー解像度">
      <option value="360">360p</option>
      <option value="540">540p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
    </select>
    <button id="fsBtn" class="btn" aria-label="全画面">⛶</button>
  </section>

  <section class="export">
    <h2>動画を書き出す</h2>
    <p class="hint">この端末のGPUで1フレームずつ描画してエンコードします（リアルタイム録画ではないので、重くてもコマ落ちしません）。</p>
    <div class="row">
      <label>解像度
        <select id="expRes">
          <option value="1080" selected>1920×1080（最終）</option>
          <option value="720">1280×720（確認用）</option>
        </select>
      </label>
      <label>ビットレート
        <select id="expBr">
          <option value="12000000">12 Mbps</option>
          <option value="20000000" selected>20 Mbps</option>
          <option value="32000000">32 Mbps</option>
        </select>
      </label>
      <button id="expBtn" class="btn primary wide">WebMを書き出す</button>
      <button id="expCancel" class="btn" hidden>中止</button>
    </div>
    <div class="progress" id="progWrap" hidden><div id="progBar"></div></div>
    <p id="expMsg" class="mono small"></p>
    <div id="result" hidden>
      <video id="resVideo" controls playsinline muted loop></video>
      <a id="dlLink" class="btn primary wide" download>ダウンロード</a>
    </div>
  </section>

  <footer class="foot">
    <p id="status" class="mono small">起動中…</p>
    <p class="mono small" id="perf"></p>
  </footer>
</main>
</body>
</html>
